spring:
  application:
    name: chat-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://db.xabewjiiewyhhjfekazv.supabase.co:5432/postgres
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: ${GROK_API_KEY:placeholder}
      base-url: "https://api.groq.com/openai"
      chat:
        options:
          model: "llama-3.3-70b-versatile"
      embedding:
        enabled: false

resilience4j:
  circuitbreaker:
    instances:
      groqAi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 10s
  retry:
    instances:
      groqAi:
        maxAttempts: 3
        waitDuration: 2s

server:
  error:
    include-stacktrace: on_param
    include-exception: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  api:
    prefix:
      b-post: v1/api/b-post
      chat-app: v1/api/chat-app
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage:
      bucket-name: images
  huggingface:
    api-key: ${HUGGINGFACE_API_KEY:}
  cloudflare:
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_API_TOKEN:}
    image-model: ${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}
    reference-image-model: ${CLOUDFLARE_REFERENCE_IMAGE_MODEL:@cf/runwayml/stable-diffusion-v1-5-img2img}
    reference-image-strength: ${CLOUDFLARE_REFERENCE_IMAGE_STRENGTH:0.65}
    image-generation-enabled: ${IMAGE_GENERATION_ENABLED:false}
