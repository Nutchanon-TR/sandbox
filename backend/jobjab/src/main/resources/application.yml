spring:
  application:
    name: jobjab-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.xabewjiiewyhhjfekazv.supabase.co:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: ${GROK_API_KEY:placeholder}
      base-url: "https://api.groq.com/openai"
      chat:
        options:
          model: "llama-3.3-70b-versatile"
      embedding:
        enabled: false

server:
  port: ${SERVER_PORT:8083}
  error:
    include-stacktrace: on_param
    include-exception: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

app:
  jobjab:
    search:
      active-run-ttl-minutes: ${JOBJAB_SEARCH_ACTIVE_RUN_TTL_MINUTES:30}
      executor:
        core-pool-size: ${JOBJAB_SEARCH_CORE_POOL_SIZE:2}
        max-pool-size: ${JOBJAB_SEARCH_MAX_POOL_SIZE:4}
        queue-capacity: ${JOBJAB_SEARCH_QUEUE_CAPACITY:100}
    ai:
      matching-enabled: ${JOBJAB_AI_MATCHING_ENABLED:false}
      auto-analyze-limit: ${JOBJAB_AI_AUTO_ANALYZE_LIMIT:0}
    digest:
      enabled: ${JOBJAB_WEEKLY_DIGEST_ENABLED:false}
      cron: ${JOBJAB_WEEKLY_DIGEST_CRON:0 0 8 ? * MON}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  api:
    prefix:
      jobjab: v1/api/jobjab
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
