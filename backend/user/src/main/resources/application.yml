spring:
  application:
    name: user-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.xabewjiiewyhhjfekazv}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  error:
    include-stacktrace: on_param
    include-exception: true

app:
  cors:
    allowedOrigins:
      # --- Production (ACA) ---
      - ${CORS_ALLOWED_ORIGIN_GATEWAY:https://gateway-service.kindwave-7b5386c8.japaneast.azurecontainerapps.io}
      # --- Local Dev (uncomment when running locally) ---
      # - http://localhost:5173
      # - http://localhost:8080
      # - http://localhost:3000
  api:
    prefix:
      user: v1/api/user
