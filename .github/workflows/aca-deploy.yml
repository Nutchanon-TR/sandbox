name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  CONTAINER_APP_ENVIRONMENT: ${{ secrets.CONTAINER_APP_ENVIRONMENT }}

jobs:
  build_and_deploy_frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build \
            --file ./frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }} \
            --tag ghcr.io/${LOWER_OWNER}/frontend:${{ github.sha }} \
            ./frontend
          docker push ghcr.io/${LOWER_OWNER}/frontend:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy frontend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: frontend
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/frontend:${{ github.sha }}
          ingress: internal
          targetPort: 3000
          minReplicas: 0
          maxReplicas: 1
        # ACA ingress reminder: set frontend ingress to "Internal" (Gateway will route traffic).
        # Note: NEXT_PUBLIC_* vars are baked into the image at build time — no runtime secret injection needed.

  build_and_deploy_chat_service:
    name: Build and Deploy Chat Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push chat-service image
        run: |
          docker build --file ./backend/chatapp/Dockerfile --tag ghcr.io/${LOWER_OWNER}/chat-service:${{ github.sha }} ./backend/chatapp
          docker push ghcr.io/${LOWER_OWNER}/chat-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy chat-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: chat-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/chat-service:${{ github.sha }}
          ingress: internal
          targetPort: 8080
          minReplicas: 1
          maxReplicas: 1

      - name: Set secrets on chat-service
        run: |
          az containerapp secret set \
            --name chat-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              supabase-db-password=${{ secrets.SUPABASE_DB_PASSWORD }} \
              supabase-url=${{ secrets.SUPABASE_URL }} \
              supabase-service-role-key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              grok-api-key=${{ secrets.GROK_API_KEY }} \
              huggingface-api-key=${{ secrets.HUGGINGFACE_API_KEY }}

      - name: Bind env vars to secrets on chat-service
        run: |
          az containerapp update \
            --name chat-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              SUPABASE_DB_PASSWORD=secretref:supabase-db-password \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              GROK_API_KEY=secretref:grok-api-key \
              HUGGINGFACE_API_KEY=secretref:huggingface-api-key

  build_and_deploy_dinner_service:
    name: Build and Deploy Dinner Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dinner-service image
        run: |
          docker build --file ./backend/dinner/Dockerfile --tag ghcr.io/${LOWER_OWNER}/dinner-service:${{ github.sha }} ./backend/dinner
          docker push ghcr.io/${LOWER_OWNER}/dinner-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy dinner-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: dinner-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/dinner-service:${{ github.sha }}
          ingress: internal
          targetPort: 8080
          minReplicas: 1
          maxReplicas: 1

      - name: Set secrets on dinner-service
        run: |
          az containerapp secret set \
            --name dinner-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              supabase-db-password=${{ secrets.SUPABASE_DB_PASSWORD }} \
              supabase-url=${{ secrets.SUPABASE_URL }} \
              supabase-service-role-key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              grok-api-key=${{ secrets.GROK_API_KEY }} \

      - name: Bind env vars to secrets on dinner-service
        run: |
          az containerapp update \
            --name dinner-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              SUPABASE_DB_PASSWORD=secretref:supabase-db-password \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              GROK_API_KEY=secretref:grok-api-key

  build_and_deploy_bpost_service:
    name: Build and Deploy B-Post Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bpost-service image
        run: |
          docker build --file ./backend/bpost/Dockerfile --tag ghcr.io/${LOWER_OWNER}/bpost-service:${{ github.sha }} ./backend/bpost
          docker push ghcr.io/${LOWER_OWNER}/bpost-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy bpost-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: bpost-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/bpost-service:${{ github.sha }}
          ingress: internal
          targetPort: 8080
          minReplicas: 1
          maxReplicas: 1

      - name: Set secrets on bpost-service
        run: |
          az containerapp secret set \
            --name bpost-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              supabase-db-password=${{ secrets.SUPABASE_DB_PASSWORD }} \
              supabase-url=${{ secrets.SUPABASE_URL }} \
              supabase-service-role-key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              grok-api-key=${{ secrets.GROK_API_KEY }}

      - name: Bind env vars to secrets on bpost-service
        run: |
          az containerapp update \
            --name bpost-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              SUPABASE_DB_PASSWORD=secretref:supabase-db-password \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              GROK_API_KEY=secretref:grok-api-key

  build_and_deploy_gateway_service:
    name: Build and Deploy Gateway Service
    needs:
      - build_and_deploy_frontend
      - build_and_deploy_chat_service
      - build_and_deploy_dinner_service
      - build_and_deploy_bpost_service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway-service image
        run: |
          docker build --file ./gateway/Dockerfile --tag ghcr.io/${LOWER_OWNER}/gateway-service:${{ github.sha }} ./gateway
          docker push ghcr.io/${LOWER_OWNER}/gateway-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy gateway-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: gateway-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/gateway-service:${{ github.sha }}
          ingress: external
          targetPort: 80
          environmentVariables: FRONTEND_PORT=80 BACKEND_PORT=80 OAUTH2_PROXY_PORT=80
        # ACA ingress reminder: set gateway-service ingress to "External".
        # Note: gateway uses plain port env vars only — no secret injection needed.

  deploy_oauth2_proxy:
    name: Deploy OAuth2 Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy oauth2-proxy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: quay.io
          containerAppName: oauth2-proxy
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          ingress: internal
          targetPort: 4180

      - name: Set secrets on oauth2-proxy
        run: |
          az containerapp secret set \
            --name oauth2-proxy \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              supabase-project-id=${{ secrets.SUPABASE_PROJECT_ID }} \
              oauth2-proxy-client-id=${{ secrets.OAUTH2_PROXY_CLIENT_ID }} \
              oauth2-proxy-client-secret=${{ secrets.OAUTH2_PROXY_CLIENT_SECRET }} \
              oauth2-proxy-cookie-secret=${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}

      - name: Bind env vars to secrets on oauth2-proxy
        run: |
          az containerapp update \
            --name oauth2-proxy \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              SUPABASE_PROJECT_ID=secretref:supabase-project-id \
              OAUTH2_PROXY_CLIENT_ID=secretref:oauth2-proxy-client-id \
              OAUTH2_PROXY_CLIENT_SECRET=secretref:oauth2-proxy-client-secret \
              OAUTH2_PROXY_COOKIE_SECRET=secretref:oauth2-proxy-cookie-secret \
              OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180 \
              OAUTH2_PROXY_PROVIDER=oidc \
              OAUTH2_PROXY_OIDC_ISSUER_URL=https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/auth/v1 \
              OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true \
              OAUTH2_PROXY_EMAIL_DOMAINS="*" \
              OAUTH2_PROXY_COOKIE_SECURE=true \
              OAUTH2_PROXY_UPSTREAM=http://dummy \
              OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS=true \
              OAUTH2_PROXY_EXTRA_JWT_ISSUERS=https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/auth/v1=https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/auth/v1 \
              OAUTH2_PROXY_REVERSE_PROXY=true

