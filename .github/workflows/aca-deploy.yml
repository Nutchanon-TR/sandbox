name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  CONTAINER_APP_ENVIRONMENT: ${{ secrets.CONTAINER_APP_ENVIRONMENT }}
  MONITORING_MIN_REPLICAS: ${{ vars.MONITORING_MIN_REPLICAS || 0 }}
  MONITORING_MAX_REPLICAS: ${{ vars.MONITORING_MAX_REPLICAS || 1 }}

jobs:
  build_and_deploy_frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build \
            --file ./frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }} \
            --tag ghcr.io/${LOWER_OWNER}/frontend:${{ github.sha }} \
            ./frontend
          docker push ghcr.io/${LOWER_OWNER}/frontend:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy frontend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: frontend
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/frontend:${{ github.sha }}
          ingress: internal
          targetPort: 3000
          minReplicas: 0
          maxReplicas: 1

      - name: Enforce min/max replicas on frontend
        run: |
          az containerapp update \
            --name frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas 0 \
            --max-replicas 1
        # ACA ingress reminder: set frontend ingress to "Internal" (Gateway will route traffic).
        # Note: NEXT_PUBLIC_* vars are baked into the image at build time — no runtime secret injection needed.

  build_and_deploy_chat_service:
    name: Build and Deploy Chat Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push chat-service image
        run: |
          docker build --file ./backend/chatapp/Dockerfile --tag ghcr.io/${LOWER_OWNER}/chat-service:${{ github.sha }} ./backend
          docker push ghcr.io/${LOWER_OWNER}/chat-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy chat-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: chat-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/chat-service:${{ github.sha }}
          ingress: internal
          targetPort: 8081
          minReplicas: 0
          maxReplicas: 1

      - name: Set secrets on chat-service
        run: |
          az containerapp secret set \
            --name chat-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              supabase-db-password=${{ secrets.SUPABASE_DB_PASSWORD }} \
              supabase-url=${{ secrets.SUPABASE_URL }} \
              supabase-service-role-key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              grok-api-key=${{ secrets.GROK_API_KEY }} \
              huggingface-api-key=${{ secrets.HUGGINGFACE_API_KEY }}

      - name: Set Cloudflare image secrets on chat-service
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Skipping Cloudflare image secrets because they are not configured."
            exit 0
          fi

          az containerapp secret set \
            --name chat-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              cloudflare-account-id="${CLOUDFLARE_ACCOUNT_ID}" \
              cloudflare-api-token="${CLOUDFLARE_API_TOKEN}"

      - name: Bind env vars to secrets on chat-service
        run: |
          az containerapp update \
            --name chat-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              SPRING_DATASOURCE_URL='jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0' \
              SPRING_DATASOURCE_USERNAME=postgres.${{ secrets.SUPABASE_PROJECT_ID }} \
              SUPABASE_DB_PASSWORD=secretref:supabase-db-password \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              GROK_API_KEY=secretref:grok-api-key \
              HUGGINGFACE_API_KEY=secretref:huggingface-api-key \
              CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS || secrets.NEXT_PUBLIC_SITE_URL }}" \
              CLOUDFLARE_IMAGE_MODEL="${{ vars.CLOUDFLARE_IMAGE_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}" \
              IMAGE_GENERATION_ENABLED="${{ vars.IMAGE_GENERATION_ENABLED || 'false' }}" \
              SERVER_PORT=8081

      - name: Bind Cloudflare image secrets on chat-service
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Skipping Cloudflare image env binding because secrets are not configured."
            exit 0
          fi

          az containerapp update \
            --name chat-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              CLOUDFLARE_ACCOUNT_ID=secretref:cloudflare-account-id \
              CLOUDFLARE_API_TOKEN=secretref:cloudflare-api-token

      - name: Enforce min/max replicas on chat-service
        run: |
          az containerapp update \
            --name chat-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas 0 \
            --max-replicas 1

  build_and_deploy_bpost_service:
    name: Build and Deploy B-Post Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bpost-service image
        run: |
          docker build --file ./backend/bpost/Dockerfile --tag ghcr.io/${LOWER_OWNER}/bpost-service:${{ github.sha }} ./backend
          docker push ghcr.io/${LOWER_OWNER}/bpost-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy bpost-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: bpost-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/bpost-service:${{ github.sha }}
          ingress: internal
          targetPort: 8080
          minReplicas: 0
          maxReplicas: 1

      - name: Set secrets on bpost-service
        run: |
          az containerapp secret set \
            --name bpost-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              supabase-db-password=${{ secrets.SUPABASE_DB_PASSWORD }} \
              supabase-url=${{ secrets.SUPABASE_URL }} \
              supabase-service-role-key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              grok-api-key=${{ secrets.GROK_API_KEY }}

      - name: Bind env vars to secrets on bpost-service
        run: |
          az containerapp update \
            --name bpost-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              SPRING_DATASOURCE_URL='jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0' \
              SPRING_DATASOURCE_USERNAME=postgres.${{ secrets.SUPABASE_PROJECT_ID }} \
              SUPABASE_DB_PASSWORD=secretref:supabase-db-password \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              GROK_API_KEY=secretref:grok-api-key \
              CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS || secrets.NEXT_PUBLIC_SITE_URL }}" \
              SERVER_PORT=8080

      - name: Enforce min/max replicas on bpost-service
        run: |
          az containerapp update \
            --name bpost-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas 0 \
            --max-replicas 1

  build_and_deploy_user_service:
    name: Build and Deploy User Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-service image
        run: |
          docker build --file ./backend/user/Dockerfile --tag ghcr.io/${LOWER_OWNER}/user-service:${{ github.sha }} ./backend
          docker push ghcr.io/${LOWER_OWNER}/user-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy user-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: user-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/user-service:${{ github.sha }}
          ingress: internal
          targetPort: 8080
          minReplicas: 0
          maxReplicas: 1

      - name: Set secrets on user-service
        run: |
          az containerapp secret set \
            --name user-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              supabase-db-password=${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Bind env vars to secrets on user-service
        run: |
          az containerapp update \
            --name user-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              SPRING_DATASOURCE_URL='jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0' \
              SPRING_DATASOURCE_USERNAME=postgres.${{ secrets.SUPABASE_PROJECT_ID }} \
              SUPABASE_DB_PASSWORD=secretref:supabase-db-password \
              CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS || secrets.NEXT_PUBLIC_SITE_URL }}"

      # Force scale settings — azure/container-apps-deploy-action sometimes ignores minReplicas/maxReplicas
      - name: Enforce min/max replicas on user-service
        run: |
          az containerapp update \
            --name user-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas 0 \
            --max-replicas 1

  build_and_deploy_gateway_service:
    name: Build and Deploy Gateway Service
    needs:
      - build_and_deploy_frontend
      - build_and_deploy_chat_service
      - build_and_deploy_bpost_service
      - build_and_deploy_user_service
      - deploy_oauth2_proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway-service image
        run: |
          docker build --file ./gateway/Dockerfile --tag ghcr.io/${LOWER_OWNER}/gateway-service:${{ github.sha }} ./gateway
          docker push ghcr.io/${LOWER_OWNER}/gateway-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy gateway-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: gateway-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/gateway-service:${{ github.sha }}
          ingress: external
          targetPort: 80
          environmentVariables: FRONTEND_PORT=80 CHAT_PORT=80 BACKEND_PORT=80 BPOST_PORT=80 OAUTH2_PROXY_PORT=80
          minReplicas: 0
          maxReplicas: 1

      - name: Enforce min/max replicas on gateway-service
        run: |
          az containerapp update \
            --name gateway-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas 0 \
            --max-replicas 1
        # ACA ingress reminder: set gateway-service ingress to "External".
        # Note: gateway uses plain port env vars only — no secret injection needed.

  deploy_oauth2_proxy:
    name: Deploy OAuth2 Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy oauth2-proxy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: quay.io
          containerAppName: oauth2-proxy
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          ingress: internal
          targetPort: 4180
          minReplicas: 0
          maxReplicas: 1

      - name: Set secrets on oauth2-proxy
        run: |
          az containerapp secret set \
            --name oauth2-proxy \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              supabase-project-id=${{ secrets.SUPABASE_PROJECT_ID }} \
              oauth2-proxy-client-id=${{ secrets.OAUTH2_PROXY_CLIENT_ID }} \
              oauth2-proxy-client-secret=${{ secrets.OAUTH2_PROXY_CLIENT_SECRET }} \
              oauth2-proxy-cookie-secret=${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}

      - name: Bind env vars to secrets on oauth2-proxy
        run: |
          az containerapp update \
            --name oauth2-proxy \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              SUPABASE_PROJECT_ID=secretref:supabase-project-id \
              OAUTH2_PROXY_CLIENT_ID=secretref:oauth2-proxy-client-id \
              OAUTH2_PROXY_CLIENT_SECRET=secretref:oauth2-proxy-client-secret \
              OAUTH2_PROXY_COOKIE_SECRET=secretref:oauth2-proxy-cookie-secret \
              OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180 \
              OAUTH2_PROXY_PROVIDER=oidc \
              OAUTH2_PROXY_OIDC_ISSUER_URL=https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/auth/v1 \
              OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true \
              OAUTH2_PROXY_EMAIL_DOMAINS="*" \
              OAUTH2_PROXY_COOKIE_SECURE=true \
              OAUTH2_PROXY_UPSTREAM=http://dummy \
              OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS=true \
              OAUTH2_PROXY_EXTRA_JWT_ISSUERS=https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/auth/v1=authenticated \
              OAUTH2_PROXY_REVERSE_PROXY=true

      # Force scale settings — azure/container-apps-deploy-action sometimes ignores minReplicas/maxReplicas
      - name: Enforce min/max replicas on oauth2-proxy
        run: |
          az containerapp update \
            --name oauth2-proxy \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas 0 \
            --max-replicas 1

  build_and_deploy_prometheus_service:
    name: Build and Deploy Prometheus Service
    needs:
      - build_and_deploy_chat_service
      - build_and_deploy_bpost_service
      - build_and_deploy_user_service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prometheus-service image
        run: |
          docker build --file ./monitoring/prometheus/Dockerfile --tag ghcr.io/${LOWER_OWNER}/prometheus-service:${{ github.sha }} ./monitoring/prometheus
          docker push ghcr.io/${LOWER_OWNER}/prometheus-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy prometheus-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: prometheus-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/prometheus-service:${{ github.sha }}
          ingress: internal
          targetPort: 9090
          minReplicas: ${{ env.MONITORING_MIN_REPLICAS }}
          maxReplicas: ${{ env.MONITORING_MAX_REPLICAS }}

      - name: Enforce min/max replicas on prometheus-service
        run: |
          az containerapp update \
            --name prometheus-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas ${{ env.MONITORING_MIN_REPLICAS }} \
            --max-replicas ${{ env.MONITORING_MAX_REPLICAS }}

  build_and_deploy_grafana_service:
    name: Build and Deploy Grafana Service
    needs:
      - build_and_deploy_prometheus_service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push grafana-service image
        run: |
          docker build --file ./monitoring/grafana/Dockerfile --tag ghcr.io/${LOWER_OWNER}/grafana-service:${{ github.sha }} ./monitoring/grafana
          docker push ghcr.io/${LOWER_OWNER}/grafana-service:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy grafana-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: grafana-service
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ env.LOWER_OWNER }}/grafana-service:${{ github.sha }}
          ingress: internal
          targetPort: 3000
          environmentVariables: GF_SECURITY_ADMIN_USER=admin GF_USERS_ALLOW_SIGN_UP=false GF_AUTH_ANONYMOUS_ENABLED=false
          minReplicas: ${{ env.MONITORING_MIN_REPLICAS }}
          maxReplicas: ${{ env.MONITORING_MAX_REPLICAS }}

      - name: Set secrets on grafana-service
        run: |
          az containerapp secret set \
            --name grafana-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              grafana-admin-password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      - name: Bind env vars to secrets on grafana-service
        run: |
          az containerapp update \
            --name grafana-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              GF_SECURITY_ADMIN_USER=admin \
              GF_SECURITY_ADMIN_PASSWORD=secretref:grafana-admin-password \
              GF_USERS_ALLOW_SIGN_UP=false \
              GF_AUTH_ANONYMOUS_ENABLED=false

      - name: Enable external ingress on grafana-service
        run: |
          az containerapp ingress enable \
            --name grafana-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --type external \
            --target-port 3000 \
            --transport auto

      - name: Enforce min/max replicas on grafana-service
        run: |
          az containerapp update \
            --name grafana-service \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --min-replicas ${{ env.MONITORING_MIN_REPLICAS }} \
            --max-replicas ${{ env.MONITORING_MAX_REPLICAS }}

  verify_cloud_ingress:
    name: Verify Cloud Ingress Guardrails
    needs:
      - build_and_deploy_gateway_service
      - deploy_oauth2_proxy
      - build_and_deploy_grafana_service
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure only gateway and Grafana are public
        shell: bash
        run: |
          set -euo pipefail

          check_ingress() {
            local app_name="$1"
            local expected_external="$2"
            local actual_external

            actual_external="$(az containerapp show \
              --name "$app_name" \
              --resource-group "${RESOURCE_GROUP}" \
              --query "properties.configuration.ingress.external" \
              -o tsv | tr '[:upper:]' '[:lower:]')"

            if [[ "$actual_external" != "$expected_external" ]]; then
              echo "::error::${app_name} ingress.external=${actual_external:-<empty>}, expected ${expected_external}"
              exit 1
            fi
          }

          check_ingress gateway-service true
          check_ingress grafana-service true

          for app_name in frontend chat-service bpost-service user-service oauth2-proxy prometheus-service; do
            check_ingress "$app_name" false
          done

