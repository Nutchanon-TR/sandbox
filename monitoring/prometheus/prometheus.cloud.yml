global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus-service

  - job_name: spring-backends
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets:
          - user-service:80
        labels:
          service: user-service
      - targets:
          - chat-service:80
        labels:
          service: chat-service
      - targets:
          - bpost-service:80
        labels:
          service: bpost-service
