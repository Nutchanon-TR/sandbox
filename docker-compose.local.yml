services:
  gateway:
    ports: !override
      - "8088:80"

  user-service:
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:8088

  frontend:
    build:
      args:
        NEXT_PUBLIC_PERSONA_FEED_DEV_ACTIONS_ENABLED: "true"

  chat-service:
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:8088
      - PERSONA_FEED_DEV_ACTIONS_ENABLED=true

  bpost-service:
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:8088

  jobjab-service:
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:8088
      - JOBJAB_AI_MATCHING_ENABLED=${JOBJAB_AI_MATCHING_ENABLED:-false}
      - JOBJAB_AI_AUTO_ANALYZE_LIMIT=${JOBJAB_AI_AUTO_ANALYZE_LIMIT:-0}
      - JOBJAB_WEEKLY_DIGEST_ENABLED=${JOBJAB_WEEKLY_DIGEST_ENABLED:-false}
