version: '3.8'

services:
  # ----------------------------------------
  # API Gateway (Nginx)
  # ----------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - FRONTEND_PORT=80
      - CHAT_PORT=80
      - BACKEND_PORT=80
      - BPOST_PORT=80
      - OAUTH2_PROXY_PORT=80
    depends_on:
      - frontend
      - chat-service
      - bpost-service
      - user-service
      - oauth2-proxy
    networks:
      - sandbox_net
    restart: unless-stopped

  # ----------------------------------------
  # OAuth2 Validation Sidecar
  # ----------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    user: "0"
    command:
      - "--http-address=0.0.0.0:80"
      - "--provider=oidc"
      - "--oidc-issuer-url=https://${SUPABASE_PROJECT_ID:-YOUR_SUPABASE_ID}.supabase.co/auth/v1"
      - "--skip-provider-button=true"
      - "--email-domain=*"
      - "--cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:-0123456789abcdef0123456789abcdef}"
      - "--cookie-secure=false" # Set true in production
      - "--upstream=http://dummy" # Nginx is actually reversing to OAuth, we don't use this routing directly.
      - "--skip-jwt-bearer-tokens=true" # VERY IMPORTANT: to parse Authorization: Bearer <jwt> headers
      - "--extra-jwt-issuers=https://${SUPABASE_PROJECT_ID:-YOUR_SUPABASE_ID}.supabase.co/auth/v1=authenticated"
    environment:
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID:-DUMMY}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET:-DUMMY}
    networks:
      - sandbox_net
    restart: unless-stopped

  # ----------------------------------------
  # Next.js Frontend
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        EXPOSE_PORT: 80
    environment:
      - PORT=80
      - HOSTNAME=0.0.0.0
    # No exposed ports because Gateway handles it
    networks:
      - sandbox_net
    # Environment intentionally omitted; frontend uses relative URLs through gateway.
      # NOTE: NEXT_PUBLIC_* variables are baked into the Next.js bundle at BUILD TIME.
      # Runtime injection via docker-compose environment has NO effect on the compiled bundle.
      # → axios falls back to '' (relative URLs) which routes through Nginx gateway automatically.
      # → If absolute URL is needed, pass as --build-arg NEXT_PUBLIC_API_URL=... in Dockerfile.
      #
      # Local Dev: uncomment below to override for a non-gateway dev setup
      # - NEXT_PUBLIC_API_URL=http://localhost
    restart: unless-stopped

  # ----------------------------------------
  # Backend Services
  # ----------------------------------------
  chat-service:
    # Context = ./backend (not ./backend/chatapp) so the build stage can also
    # COPY the sibling common-auth/ library. See backend/chatapp/Dockerfile.
    build:
      context: ./backend
      dockerfile: chatapp/Dockerfile
      args:
        EXPOSE_PORT: 80
    env_file: .env
    environment:
      - SERVER_PORT=80
    networks:
      - sandbox_net
    restart: unless-stopped

  bpost-service:
    # Context = ./backend so the build stage can COPY common-auth/.
    # See backend/bpost/Dockerfile.
    build:
      context: ./backend
      dockerfile: bpost/Dockerfile
      args:
        EXPOSE_PORT: 80
    env_file: .env
    environment:
      - SERVER_PORT=80
    networks:
      - sandbox_net
    restart: unless-stopped

  user-service:
    # Context = ./backend so the build stage can COPY common-auth/.
    # See backend/user/Dockerfile.
    build:
      context: ./backend
      dockerfile: user/Dockerfile
      args:
        EXPOSE_PORT: 80
    env_file: .env
    environment:
      - SERVER_PORT=80
    networks:
      - sandbox_net
    restart: unless-stopped

networks:
  sandbox_net:
    driver: bridge
